name: Publish frontend container
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      frontend_tag:
        description: Published frontend tag to dispatch to the desktop release workflow.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push' && github.event.deleted == false
    uses: ./.github/workflows/check.yaml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_LEGACY_REPO: karbowiak/ircord
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-changelog.mjs server/assets/changelog.json CHANGELOG.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.8.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/ircord/ircord-frontend:${{ github.ref_name }}
            ghcr.io/ircord/ircord-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          notes=$(bun scripts/release-changelog.mjs --notes "$RELEASE_TAG" CHANGELOG.md)
          flags=(--verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if [[ -n "$notes" ]]; then
            flags+=(--notes "$notes")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}"

  desktop:
    name: Trigger desktop release
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch the published frontend tag
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          FRONTEND_TAG: ${{ inputs.frontend_tag || github.ref_name }}
        run: |
          if [[ ! "$FRONTEND_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::warning::Set DESKTOP_RELEASE_TOKEN to dispatch the IRCord Desktop release.'
            exit 0
          fi
          gh workflow run publish.yaml --repo ircord/desktop --ref main -f "frontend_tag=$FRONTEND_TAG"
